name: Pharma Cold-Chain Inventory Management Environment
description: >
  An OpenEnv-compliant environment for pharmaceutical warehouse procurement.
  An LLM agent manages a warehouse stocking five drugs (insulin, paracetamol,
  bp_medication, vitamins, hydroxychloroquine) across two storage pools
  (refrigerated cold storage for insulin, ambient for the rest), each sized to
  21 days of its SKUs' base demand. Every day the agent receives an
  inventory report and decides how much of each SKU to order.
  Demand follows per-task curves and supplier lead times can step up during
  disruptions. The agent never sees true demand or true lead times — it must
  infer them from observed history and act under uncertainty to maximise
  demand fill rate while avoiding overflow waste.
version: "1.0.0"
author: BishnuGanguly

observation_space:
  type: structured_json
  description: >
    An InventoryState JSON object.
    Global: current_date, cold/ambient storage total and current capacity,
    expected_inbound_orders [(sku_id, quantity, expected_arrival_day)],
    inventory_excess_today (units wasted to overflow today),
    waste_fraction_today (waste_penalty-weighted share of today's deliveries wasted),
    inventory_excess_cumulative, done, reward.
    Per SKU: inventory_on_hand, avg_demand_per_day, avg_demand_last_5_days,
    avg_lead_time, lead_time_last3_orders (observed on delivery),
    stockout_days_if_no_reorder, cold_storage_required, stockout_penalty, waste_penalty,
    demand_fulfilled_today, demand_fulfilled_cumulative.
    Hidden from the agent's prompt: true demand, true lead times and the
    task's demand / lead-time curves.

action_space:
  type: structured_json
  description: >
    A JSON object mapping SKU names to order quantities, either as
    PharmaAction.orders or embedded in PharmaAction.message (raw LLM text;
    the first JSON object is extracted).
    Example: {"insulin": 100, "paracetamol": 500}
    An empty object {} means no orders today.
  constraints:
    - quantities must be positive finite numbers; others are ignored
    - unknown SKU names are ignored (matching is case-insensitive)
    - deliveries that exceed free capacity in their storage pool are wasted

reset_parameters:
  seed: Seeds task generation and demand / lead-time noise.
  task_name: One of the task ids below.
  episode_config: A full EpisodeConfig (JSON) — overrides task_name.

endpoints:
  health: /health
  reset:  /reset
  step:   /step
  state:  /state

tasks:
  - id: supply_chain_broken
    description: >
      Flat demand for all SKUs. Insulin lead times step up 2-5x during
      days 15-25, then paracetamol lead times step up 2-5x during days 30-40.
      The agent must build safety stock before each disruption.
    duration_days: 60
    key_challenge: "anticipatory ordering under lead time extension"

  - id: flu_season
    description: >
      Paracetamol demand follows a Gaussian flu wave peaking at day 30
      (up to 3x baseline, width 10 days) while its lead times step up 2-5x
      during days 30-40.
    duration_days: 60
    key_challenge: "pre-stock before the peak while lead times are still short"

  - id: epidemic_two_wave
    description: >
      Hydroxychloroquine demand has two waves (peaks at day 17 and a larger
      one at day 45); HCQ lead times step up during days 17-27. Insulin sees
      a mild demand elevation around day 20 and a lead time step during
      days 20-30. The trough between waves is a trap.
    duration_days: 60
    key_challenge: "two-wave reasoning — keep ordering through the trough"

scoring:
  success_threshold: 0.80

  step_reward_formula: >
    step_reward = mean_over_skus(demand_fulfilled_today)
                - waste_fraction_today
    where waste_fraction_today = sum_i(waste_penalty_i * wasted_i / delivered_i)
                                 / sum_i(waste_penalty_i)
    over the SKUs delivered today (0 if nothing arrived). Range [-1, 1].

  final_score_formula: >
    final_score = (0.6 * mean_over_skus(sum_over_days(demand_fulfilled_today))
                 + 0.4 * sum_over_days(1 - waste_fraction_today))
                 / no_of_days
    Range [0, 1].

constraints:
  max_runtime_seconds: 1200
  max_memory_gb: 4
  max_steps_per_task: 60
  episode_length_days: 60
